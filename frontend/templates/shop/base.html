{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}ValoraPharma Shop{% endblock %}</title><link rel="stylesheet" href="{% static 'shop/shop.css' %}"></head>
<body><header class="site-header"><a class="brand" href="/shop/"><img class="brand-mark" src="{% static 'accounts/assets/pill-login.svg' %}" alt=""><span>Valora<span class="brand-accent">Pharma</span></span></a><nav><a href="/">Home</a><a href="/shop/">Products</a><a href="/">About</a><a href="/">Contact</a><a class="nav-shop" href="/shop/">Shop</a></nav><div class="header-actions"><a class="cart-link" href="/cart/" aria-label="Cart">🛒<span class="cart-count">{{ cart_count }}</span></a>{% if user.is_authenticated %}<a href="/logout/">Sign Out</a>{% else %}<a href="/login/">Sign In</a><a class="register-link" href="/register/">Register</a>{% endif %}</div></header>
<main>{% block content %}{% endblock %}</main><script src="{% static 'shop/shop.js' %}" defer></script></body></html>
