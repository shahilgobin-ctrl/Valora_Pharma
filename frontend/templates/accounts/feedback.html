{% if form.errors %}
  <div
    class="form-feedback form-feedback--error"
    id="form-errors"
    role="alert"
    tabindex="-1"
  >
    <p>Please check the highlighted fields.</p>
    {% for error in form.non_field_errors %}
      <p>{{ error }}</p>
    {% endfor %}
  </div>
{% endif %}

{% if messages %}
  <div class="form-feedback" role="status">
    {% for message in messages %}
      <p>{{ message }}</p>
    {% endfor %}
  </div>
{% endif %}
