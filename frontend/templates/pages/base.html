<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="About ValoraPharma, a university pharmacy website project.">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}ValoraPharma{% endblock %}</title>
    <link rel="icon" href="data:,">
    <style>

        /* Desktop measurements follow the 856 px website frame in the design. */
        .vp-shell {
            margin: 0;
            background: #fff;
            color: #000;
            font-family: "Poppins", Arial, sans-serif;
        }
        .vp-shell *, .vp-shell *::before, .vp-shell *::after { box-sizing: border-box; }
        .vp-page {
            --unit: calc(min(100vw, 1440px) / 856);
            max-width: 1440px;
            margin-inline: auto;
        }
        .vp-header { height: calc(51 * var(--unit)); background: #d9d9d9; }
        .vp-header__inner {
            height: 100%;
            display: grid;
            grid-template-columns: 24.5327% 43.2243% 32.243%;
            align-items: center;
            padding-top: calc(4 * var(--unit));
        }
        .vp-brand {
            display: inline-flex;
            align-items: center;
            gap: calc(2 * var(--unit));
            margin-left: calc(9 * var(--unit));
            width: fit-content;
            color: #008078;
            font-size: calc(10 * var(--unit));
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
        }
        .vp-brand svg { width: calc(26 * var(--unit)); height: calc(26 * var(--unit)); flex: none; }
        .vp-brand__accent { color: #e67f11; }
        .vp-nav__list {
            display: grid;
            grid-template-columns: 21.6216% 19.4595% 19.4595% 20.2703% 19.1891%;
            align-items: center;
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .vp-nav__item {
            display: inline-block;
            padding: calc(5 * var(--unit)) calc(10 * var(--unit));
            border-radius: calc(11 * var(--unit));
            color: #008078;
            font-size: calc(10 * var(--unit));
            line-height: 1.6;
            text-decoration: none;
            white-space: nowrap;
        }
        .vp-nav__item--active { background: #cdcfcb; }
        .vp-nav a:hover { background: #c5c9c6; }
        .vp-account {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: calc(19 * var(--unit));
            padding-right: calc(10 * var(--unit));
            color: #008078;
            font-size: calc(10 * var(--unit));
            font-weight: 600;
            white-space: nowrap;
        }
        .vp-account a { text-decoration: none; }
        .vp-signin { color: #008078; }
        .vp-cart { display: inline-flex; }
        .vp-cart svg { width: calc(18 * var(--unit)); height: calc(19 * var(--unit)); }
        .vp-register {
            margin-left: calc(11 * var(--unit));
            width: calc(74 * var(--unit));
            line-height: calc(17 * var(--unit));
            border-radius: calc(12 * var(--unit));
            background: #087c73;
            color: #fff;
            text-align: center;
        }
        .vp-unavailable { cursor: default; }
        .vp-main { margin-top: calc(12 * var(--unit)); }
        .vp-about { background: #d9d9d9; font-size: calc(10.6667 * var(--unit)); line-height: 1.46; }
        .vp-about__intro { display: grid; grid-template-columns: 57.243% 42.757%; min-height: calc(308 * var(--unit)); }
        .vp-about__copy { padding: calc(65 * var(--unit)) 0 calc(34 * var(--unit)) calc(23 * var(--unit)); }
        .vp-about h1 {
            width: 86%;
            margin: 0 0 calc(15 * var(--unit));
            color: #008078;
            font-size: calc(16 * var(--unit));
            font-weight: 600;
            line-height: 1.25;
            text-align: center;
        }
        .vp-about__copy p { margin: 0; letter-spacing: calc(-0.25 * var(--unit)); }
        .vp-about__copy p:nth-of-type(n + 3) { margin-top: calc(16 * var(--unit)); }
        .vp-about__photo { min-width: 0; margin: 0; position: relative; }
        .vp-about__photo img { display: block; position: absolute; width: 100%; height: 100%; object-fit: cover; }
        .vp-about__benefits {
            min-height: calc(315 * var(--unit));
            border-top: calc(20 * var(--unit)) solid #fff;
            padding-top: calc(13 * var(--unit));
            padding-bottom: calc(52 * var(--unit));
        }
        .vp-about h2 {
            margin: 0 0 calc(31 * var(--unit)) calc(79 * var(--unit));
            color: #008078;
            font-size: calc(14 * var(--unit));
            font-weight: 600;
            line-height: 1.5;
        }
        .vp-about__cards {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-auto-rows: 1fr;
            gap: calc(61 * var(--unit));
            margin-left: calc(51 * var(--unit));
            margin-right: calc(83 * var(--unit));
        }
        .vp-about__card {
            min-height: calc(178 * var(--unit));
            padding: calc(34 * var(--unit)) calc(24 * var(--unit)) calc(24 * var(--unit));
            color: #fff;
        }
        .vp-about__card--orange { background: #e67f11; }
        .vp-about__card--teal { background: #087c73; }
        .vp-about h3 { margin: 0 0 calc(22 * var(--unit)); font-size: calc(16 * var(--unit)); font-weight: 600; line-height: 1.5; text-align: center; }
        .vp-about__card p { margin: 0; line-height: 1.5; }
        .vp-about__card:first-child { padding-top: calc(40 * var(--unit)); padding-inline: calc(5 * var(--unit)); }
        .vp-about__card:first-child h3 { margin-bottom: calc(19 * var(--unit)); }
        .vp-about__card:last-child h3 { margin-bottom: 0; }
        .vp-about__notes { padding: 20px 24px; border-top: 1px solid #c4c4c4; color: #444; background: #eee; font-size: 12px; line-height: 1.6; }
        .vp-about__notes p { margin: 0 0 8px; }
        .vp-about__notes p:last-child { margin-bottom: 0; }
        .vp-skip { position: absolute; top: -100px; left: 12px; z-index: 2; padding: 12px 16px; color: #005a55; background: #fff; }
        .vp-skip:focus { top: 8px; }
        .vp-shell a:focus-visible { outline: 3px solid #174eaa; outline-offset: 3px; }
        .vp-main:focus { outline: 3px solid #174eaa; outline-offset: -3px; }

        /* Smaller screens use readable text and let the layout wrap naturally. */
        @media (max-width: 820px) {
            .vp-page { --unit: 1px; }
            .vp-header { height: auto; }
            .vp-header__inner { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding: 16px; }
            .vp-brand { margin-left: 0; font-size: 14px; }
            .vp-brand svg { width: 32px; height: 32px; }
            .vp-nav { order: 3; width: 100%; }
            .vp-nav__list { display: flex; justify-content: space-around; flex-wrap: wrap; }
            .vp-nav__item { padding: 12px 10px; font-size: 12px; }
            .vp-account { font-size: 12px; padding-right: 0; gap: 14px; }
            .vp-register { width: auto; padding: 5px 12px; margin-left: 0; }
            .vp-about { font-size: 16px; line-height: 1.65; }
            .vp-about__intro { grid-template-columns: 1fr; }
            .vp-about__copy { padding: 32px 24px; }
            .vp-about h1 { width: 100%; font-size: 24px; margin-bottom: 24px; }
            .vp-about__copy p { letter-spacing: normal; }
            .vp-about__copy p + p { margin-top: 16px; }
            .vp-about__photo { aspect-ratio: 365 / 308; }
            .vp-about__benefits { min-height: 0; padding: 24px; }
            .vp-about h2 { margin: 0 0 28px; font-size: 19px; text-align: center; }
            .vp-about__cards { margin: 0; gap: 20px; }
            .vp-about__card, .vp-about__card:first-child { min-height: 230px; padding: 28px 18px; }
            .vp-about h3, .vp-about__card:first-child h3, .vp-about__card:last-child h3 { margin-bottom: 20px; font-size: 18px; }
            .vp-about__card p { font-size: 14px; }
        }
        @media (max-width: 600px) {
            .vp-about__cards { grid-template-columns: 1fr; }
            .vp-about__card, .vp-about__card:first-child { min-height: 190px; padding: 30px 24px; }
            .vp-about h3 { font-size: 20px; }
            .vp-about__card p { font-size: 16px; }
        }
        @media (max-width: 400px) {
            .vp-header__inner { justify-content: center; }
            .vp-brand { justify-content: center; width: 100%; }
            .vp-account { order: 3; width: 100%; justify-content: center; }
            .vp-nav { order: 2; }
            .vp-nav__item { padding-inline: 7px; }
        }

<body class="vp-shell">
    <a class="vp-skip" href="#main-content">Skip to main content</a>
    <div class="vp-page">
        <header class="vp-header">
            <div class="vp-header__inner">
                <a class="vp-brand" href="{% if preview_mode %}#about{% else %}{% url 'pages:about' %}{% endif %}" aria-label="ValoraPharma About page">
                    <svg viewBox="0 0 26 26" aria-hidden="true" focusable="false">
                        <rect width="26" height="26" rx="8" fill="#008078"/>
                        <g transform="rotate(-44 13 13)">
                            <rect x="6.5" y="3" width="13" height="20" rx="6.5" fill="none" stroke="#080b0b" stroke-width="1.3"/>
                            <path d="M6.5 13h13v3.5a6.5 6.5 0 0 1-13 0z" fill="#080b0b"/>
                        </g>
                    </svg>
                    <span>Valora<span class="vp-brand__accent">Pharma</span></span>
                </a>
                <nav class="vp-nav" aria-label="Main navigation" aria-describedby="demo-notice">
                    <ul class="vp-nav__list">
                        <li><span class="vp-nav__item vp-unavailable" role="link" aria-disabled="true" title="Home is not available in this preview">Home</span></li>
                        <li><span class="vp-nav__item vp-unavailable" role="link" aria-disabled="true" title="Products is not available in this preview">Products</span></li>
                        <li><span class="vp-nav__item vp-unavailable" role="link" aria-disabled="true" title="Shop is not available in this preview">Shop</span></li>
                        <li><a class="vp-nav__item{% if active_page == 'about' %} vp-nav__item--active{% endif %}" href="{% if preview_mode %}#about{% else %}{% url 'pages:about' %}{% endif %}"{% if active_page == 'about' %} aria-current="page"{% endif %}>About</a></li>
                        <li><span class="vp-nav__item vp-unavailable" role="link" aria-disabled="true" title="Contact is not available in this preview">Contact</span></li>
                    </ul>
                </nav>
                <div class="vp-account" role="group" aria-label="Account and cart preview" aria-describedby="demo-notice">
                    <span class="vp-cart vp-unavailable" role="link" aria-disabled="true" aria-label="Shopping cart, unavailable in this preview" title="The cart is not available in this preview">
                        <svg viewBox="0 0 18 19" aria-hidden="true" focusable="false">
                            <rect x="1" y="1" width="16" height="17" rx="6" fill="#008078"/>
                            <path d="M2 4h2l1.3 8h9l1.2-7H4.2M5.5 14h8" fill="none" stroke="#101010" stroke-width="1.2"/>
                            <circle cx="6.5" cy="16" r="1"/><circle cx="12.5" cy="16" r="1"/>
                        </svg>
                    </span>
                    {% if preview_mode %}
                    <span class="vp-signin vp-unavailable" role="link" aria-disabled="true" title="Sign in needs the Django server">Sign in</span>
                    <span class="vp-register vp-unavailable" role="link" aria-disabled="true" title="Registration needs the Django server">Register</span>
                    {% else %}
                    <a class="vp-signin" href="{% url 'accounts:login' %}">Sign in</a>
                    <a class="vp-register" href="{% url 'accounts:register' %}">Register</a>
                    {% endif %}
                </div>
            </div>
        </header>
        <main class="vp-main" id="main-content" tabindex="-1">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
