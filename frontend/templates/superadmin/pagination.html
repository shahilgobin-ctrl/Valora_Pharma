{% if items.paginator.num_pages > 1 %}
  <nav class="pagination" aria-label="Pagination">
    {% if items.has_previous %}
      <a href="?page={{ items.previous_page_number }}&amp;q={{ request.GET.q|urlencode }}&amp;status={{ request.GET.status|urlencode }}&amp;action={{ request.GET.action|urlencode }}">
        &larr; Previous
      </a>
    {% endif %}

    <span>
      Page {{ items.number }} of {{ items.paginator.num_pages }}
    </span>

    {% if items.has_next %}
      <a href="?page={{ items.next_page_number }}&amp;q={{ request.GET.q|urlencode }}&amp;status={{ request.GET.status|urlencode }}&amp;action={{ request.GET.action|urlencode }}">
        Next &rarr;
      </a>
    {% endif %}
  </nav>
{% endif %}
